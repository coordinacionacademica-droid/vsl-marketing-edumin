<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Pago Exitoso! - Instituto Avanza</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .check-icon {
      width: 80px;
      height: 80px;
      background: rgba(16, 185, 129, 0.2);
      border: 3px solid #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #10b981;
      font-size: 40px;
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .info-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 25px;
      text-align: left;
      font-size: 0.9rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .btn-return {
      display: inline-block;
      width: 100%;
      background: #10b981;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn-return:hover {
      background: #059669;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="check-icon">✓</div>
    <h1>¡Felicitaciones por tu Compra!</h1>
    <p>Tu pago ha sido procesado de manera 100% segura mediante <strong>dLocal Go</strong>. Tus accesos han sido enviados a tu correo electrónico.</p>

    <div class="info-box">
      <div class="info-row">
        <span style="color: #64748b;">Estado del Pago:</span>
        <span style="color: #10b981; font-weight: 600;">APROBADO</span>
      </div>
      <div class="info-row">
        <span style="color: #64748b;">Número de Orden:</span>
        <span id="orderIdText" style="font-family: monospace;">ORD-XXXXXX</span>
      </div>
      <div class="info-row">
        <span style="color: #64748b;">Acceso al Área de Miembros:</span>
        <span style="color: #f59e0b; font-weight: 600;">Inmediato</span>
      </div>
    </div>

    <a href="/" class="btn-return">Volver al Inicio</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || 'ORD-' + Math.floor(Math.random() * 900000 + 100000);
    document.getElementById('orderIdText').innerText = orderId;
  </script>

</body>
</html>
